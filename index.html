<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Striker</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #0d1220;
    --accent: #38bdf8;
    --accent2: #0ea5e9;
    --danger: #f87171;
    --gold: #fbbf24;
    --text: #e5e7eb;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
  }
  h1 {
    margin: 0;
    font-size: 1.3rem;
    letter-spacing: 1px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(56,189,248,0.5);
  }
  #hud {
    display: flex;
    gap: 20px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  #hud span { color: var(--accent); font-weight: 700; }
  #hud .lives { color: var(--danger); }
  #board-wrap {
    position: relative;
    background: var(--panel);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 0 30px rgba(56,189,248,0.15), 0 4px 20px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    border-radius: 6px;
    background: #020306;
    max-width: 92vw;
    max-height: 62vh;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(2,3,6,0.9);
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.4rem; color: var(--accent); }
  #overlay p { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 280px; line-height: 1.4; }
  button {
    background: linear-gradient(180deg, var(--accent2), #0369a1);
    color: #fff;
    border: none;
    padding: 11px 26px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(14,165,233,0.4);
  }
  button:active { transform: scale(0.96); }
  #hint {
    font-size: 0.78rem;
    color: var(--muted);
  }
  #touch-zone {
    display: none;
    width: 100%;
    max-width: 400px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
  @media (max-width: 600px) {
    #touch-zone { display: block; }
  }
  #boss-bar-wrap {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  #boss-bar-wrap.show { display: flex; }
  #boss-label {
    font-size: 0.65rem;
    color: var(--danger);
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  #boss-bar-bg {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
  }
  #boss-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f87171, #fbbf24);
    width: 100%;
    transition: width 0.15s linear;
  }
</style>
</head>
<body>
  <h1>✈️ SKY STRIKER</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div class="lives">Lives: <span id="lives">3</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div id="board-wrap">
    <canvas id="board" width="360" height="500"></canvas>
    <div id="boss-bar-wrap">
      <span id="boss-label">BOSS</span>
      <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>
    </div>
    <div id="overlay">
      <h2 id="overlay-title">SKY STRIKER</h2>
      <p id="overlay-msg">Arrow keys / WASD to move. Fire is automatic. Grab gold stars for weapon power-ups. Bosses arrive every wave — good luck!</p>
      <button id="start-btn">Start Mission</button>
    </div>
  </div>
  <div id="touch-zone">Drag anywhere on the screen to move your plane</div>

<script>
(function() {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');
  const bossBarWrap = document.getElementById('boss-bar-wrap');
  const bossBarFill = document.getElementById('boss-bar-fill');

  let best = parseInt(safeGet('striker_best') || '0', 10);
  bestEl.textContent = best;
  function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  let player, bullets, enemies, enemyBullets, particles, stars, powerups;
  let score, lives, running, frame, spawnTimer, powerupTimer, invincible;
  let keys = {};
  let weaponLevel;
  let wave, boss, bossMaxHp, nextBossScore, bannerTimer, bannerText;

  function reset() {
    player = { x: W/2 - 16, y: H - 90, w: 32, h: 36, speed: 4.2, cooldown: 0 };
    bullets = [];
    enemies = [];
    enemyBullets = [];
    particles = [];
    stars = [];
    powerups = [];
    score = 0;
    lives = 3;
    weaponLevel = 1;
    frame = 0;
    spawnTimer = 0;
    powerupTimer = 300;
    invincible = 0;
    running = true;
    wave = 1;
    boss = null;
    bossMaxHp = 0;
    nextBossScore = 400;
    bannerTimer = 0;
    bannerText = '';
    bossBarWrap.classList.remove('show');
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    for (let i = 0; i < 60; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, sp: Math.random()*2+1 });
    }
  }

  function rectHit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function spawnEnemy() {
    // difficulty ramps with survival time and score
    const ramp = Math.min(1, frame / 3600); // reaches full ramp after ~60s
    const scoreRamp = Math.min(1, score / 1500);
    const diff = Math.max(ramp, scoreRamp);
    const speedMul = 1 + diff * 0.9;
    const hpBonus = Math.floor(diff * 2);

    const type = Math.random();
    if (type < Math.max(0.3, 0.55 - diff*0.2)) {
      enemies.push({ kind: 'grunt', x: Math.random()*(W-30), y: -30, w: 26, h: 26, hp: 1+Math.floor(hpBonus/2), speed: (1.6+Math.random()*1.2)*speedMul, shootT: Math.random()*80, vx: 0 });
    } else if (type < 0.85) {
      enemies.push({ kind: 'zig', x: Math.random()*(W-30), y: -30, w: 26, h: 26, hp: 2+hpBonus, speed: 1.4*speedMul, shootT: Math.random()*80, vx: (Math.random()<0.5?-1:1)*1.5, t: 0 });
    } else {
      enemies.push({ kind: 'tank', x: Math.random()*(W-44), y: -40, w: 40, h: 34, hp: 6+hpBonus*2, speed: 0.8*speedMul, shootT: 30, vx: 0 });
    }
  }

  function spawnBoss() {
    wave++;
    bossMaxHp = 40 + wave*25;
    boss = {
      x: W/2 - 45, y: -100, w: 90, h: 70,
      hp: bossMaxHp, speed: 1.4,
      dir: 1, phase: 0, shootT: 60, entering: true, targetY: 70
    };
    bannerText = `WAVE ${wave} — BOSS INCOMING`;
    bannerTimer = 150;
    bossBarWrap.classList.add('show');
  }

  function spawnPowerup() {
    powerups.push({ x: Math.random()*(W-20), y: -20, w: 20, h: 20, speed: 1.8 });
  }

  function playerShoot() {
    const cx = player.x + player.w/2;
    if (weaponLevel === 1) {
      bullets.push({ x: cx-2, y: player.y, w: 4, h: 12, vx: 0, vy: -8 });
    } else if (weaponLevel === 2) {
      bullets.push({ x: cx-8, y: player.y+4, w: 4, h: 12, vx: -0.5, vy: -8 });
      bullets.push({ x: cx+4, y: player.y+4, w: 4, h: 12, vx: 0.5, vy: -8 });
    } else if (weaponLevel === 3) {
      bullets.push({ x: cx-2, y: player.y-4, w: 4, h: 12, vx: 0, vy: -8.5 });
      bullets.push({ x: cx-10, y: player.y+4, w: 4, h: 12, vx: -1.2, vy: -8 });
      bullets.push({ x: cx+6, y: player.y+4, w: 4, h: 12, vx: 1.2, vy: -8 });
    } else if (weaponLevel === 4) {
      bullets.push({ x: cx-2, y: player.y-6, w: 4, h: 14, vx: 0, vy: -9 });
      bullets.push({ x: cx-12, y: player.y+2, w: 4, h: 12, vx: -1.6, vy: -8.2 });
      bullets.push({ x: cx+8, y: player.y+2, w: 4, h: 12, vx: 1.6, vy: -8.2 });
      bullets.push({ x: cx-18, y: player.y+8, w: 4, h: 10, vx: -2.4, vy: -7 });
      bullets.push({ x: cx+14, y: player.y+8, w: 4, h: 10, vx: 2.4, vy: -7 });
    } else {
      bullets.push({ x: cx-2, y: player.y-8, w: 5, h: 16, vx: 0, vy: -9.5, pierce: true });
      bullets.push({ x: cx-2, y: player.y-2, w: 4, h: 12, vx: 0, vy: -9 });
      bullets.push({ x: cx-14, y: player.y+2, w: 4, h: 12, vx: -1.8, vy: -8.3 });
      bullets.push({ x: cx+10, y: player.y+2, w: 4, h: 12, vx: 1.8, vy: -8.3 });
      bullets.push({ x: cx-20, y: player.y+8, w: 4, h: 10, vx: -2.8, vy: -7 });
      bullets.push({ x: cx+16, y: player.y+8, w: 4, h: 10, vx: 2.8, vy: -7 });
    }
  }

  function explode(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random()*Math.PI*2;
      const sp = Math.random()*3+1;
      particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 24+Math.random()*10, color });
    }
  }

  function update() {
    frame++;
    // starfield
    stars.forEach(s => { s.y += s.sp; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });

    // player movement
    const dx = (keys.right?1:0) - (keys.left?1:0);
    const dy = (keys.down?1:0) - (keys.up?1:0);
    player.x = Math.max(0, Math.min(W-player.w, player.x + dx*player.speed));
    player.y = Math.max(0, Math.min(H-player.h, player.y + dy*player.speed));

    // shooting
    player.cooldown--;
    if (player.cooldown <= 0) {
      playerShoot();
      player.cooldown = 9;
    }

    // bullets
    bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W+20);

    enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    enemyBullets = enemyBullets.filter(b => b.y < H+20 && b.y > -20);

    // boss trigger
    if (!boss && score >= nextBossScore) {
      spawnBoss();
      nextBossScore += 550 + wave*80;
    }

    // spawn enemies (lighter while a boss is active)
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnEnemy();
      const base = Math.max(16, 55 - Math.floor(score/150) - wave*2);
      spawnTimer = boss ? base * 1.8 : base;
    }
    powerupTimer--;
    if (powerupTimer <= 0) {
      spawnPowerup();
      powerupTimer = 450 + Math.random()*250;
    }

    if (bannerTimer > 0) bannerTimer--;

    // enemies
    enemies.forEach(e => {
      e.y += e.speed;
      if (e.kind === 'zig') {
        e.t += 1;
        e.x += Math.sin(e.t*0.08) * 1.8;
      }
      e.shootT--;
      if (e.shootT <= 0 && e.y > 0 && e.y < H-60) {
        const ex = e.x + e.w/2, ey = e.y + e.h;
        const ang = Math.atan2(player.y - ey, player.x - ex);
        enemyBullets.push({ x: ex-3, y: ey, w: 6, h: 6, vx: Math.cos(ang)*3.2, vy: Math.sin(ang)*3.2 });
        e.shootT = e.kind === 'tank' ? 45 : 90;
      }
    });
    enemies = enemies.filter(e => e.y < H+50);

    // boss behavior
    if (boss) {
      if (boss.entering) {
        boss.y += 1.6;
        if (boss.y >= boss.targetY) { boss.y = boss.targetY; boss.entering = false; }
      } else {
        boss.phase += 1;
        boss.x += boss.dir * boss.speed;
        if (boss.x <= 0 || boss.x >= W - boss.w) boss.dir *= -1;

        boss.shootT--;
        if (boss.shootT <= 0) {
          const cx = boss.x + boss.w/2, cy = boss.y + boss.h;
          const hpRatio = boss.hp / bossMaxHp;
          const spread = hpRatio < 0.35 ? 7 : hpRatio < 0.7 ? 5 : 3;
          for (let i = 0; i < spread; i++) {
            const ang = Math.PI/2 + (i - (spread-1)/2) * 0.22;
            enemyBullets.push({ x: cx-3, y: cy, w: 6, h: 6, vx: Math.cos(ang)*3.4, vy: Math.sin(ang)*3.4 });
          }
          boss.shootT = hpRatio < 0.35 ? 34 : hpRatio < 0.7 ? 46 : 60;
        }
      }
      bossBarFill.style.width = Math.max(0, boss.hp/bossMaxHp*100) + '%';
    }

    // powerups
    powerups.forEach(p => p.y += p.speed);
    powerups = powerups.filter(p => p.y < H+30);

    // particles
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; });
    particles = particles.filter(p => p.life > 0);

    if (invincible > 0) invincible--;

    // collisions: player bullets vs enemies
    for (let i = enemies.length-1; i>=0; i--) {
      const e = enemies[i];
      for (let j = bullets.length-1; j>=0; j--) {
        const b = bullets[j];
        if (rectHit(b, e)) {
          bullets.splice(j,1);
          e.hp--;
          explode(b.x, b.y, '#38bdf8', 4);
          if (e.hp <= 0) {
            explode(e.x+e.w/2, e.y+e.h/2, '#fbbf24', 14);
            score += e.kind === 'tank' ? 100 : e.kind === 'zig' ? 40 : 20;
            scoreEl.textContent = score;
            enemies.splice(i,1);
          }
          break;
        }
      }
    }

    // collisions: player bullets vs boss
    if (boss && !boss.entering) {
      for (let j = bullets.length-1; j>=0; j--) {
        const b = bullets[j];
        if (rectHit(b, boss)) {
          if (!b.pierce) bullets.splice(j,1);
          boss.hp--;
          explode(b.x, b.y, '#fbbf24', 3);
          if (boss.hp <= 0) {
            explode(boss.x+boss.w/2, boss.y+boss.h/2, '#fb923c', 40);
            score += 300 + wave*50;
            scoreEl.textContent = score;
            lives = Math.min(5, lives+1);
            livesEl.textContent = lives;
            boss = null;
            bossBarWrap.classList.remove('show');
            bannerText = 'WAVE CLEARED! +1 LIFE';
            bannerTimer = 150;
          }
          if (!b.pierce) break;
        }
      }
    }

    // collisions: player vs enemies / enemy bullets
    if (invincible <= 0) {
      let hit = false;
      for (let i = enemies.length-1; i>=0; i--) {
        if (rectHit(player, enemies[i])) {
          explode(enemies[i].x+enemies[i].w/2, enemies[i].y+enemies[i].h/2, '#f87171', 10);
          enemies.splice(i,1);
          hit = true;
        }
      }
      for (let i = enemyBullets.length-1; i>=0; i--) {
        if (rectHit(player, enemyBullets[i])) {
          enemyBullets.splice(i,1);
          hit = true;
        }
      }
      if (boss && !boss.entering && rectHit(player, boss)) {
        hit = true;
      }
      if (hit) {
        lives--;
        livesEl.textContent = lives;
        invincible = 90;
        explode(player.x+player.w/2, player.y+player.h/2, '#f87171', 16);
        if (lives <= 0) {
          gameOver();
          return;
        }
      }
    }

    // player vs powerup
    for (let i = powerups.length-1; i>=0; i--) {
      if (rectHit(player, powerups[i])) {
        powerups.splice(i,1);
        weaponLevel = Math.min(5, weaponLevel+1);
        score += 25;
        scoreEl.textContent = score;
      }
    }

    // passive score
    if (frame % 30 === 0) { score += 1; scoreEl.textContent = score; }
  }

  function drawPlane(p, color) {
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h/2);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -p.h/2);
    ctx.lineTo(p.w/2, p.h/2);
    ctx.lineTo(0, p.h/3);
    ctx.lineTo(-p.w/2, p.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = '#020306';
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#ffffff';
    stars.forEach(s => { ctx.globalAlpha = 0.5; ctx.fillRect(s.x, s.y, s.s, s.s); });
    ctx.globalAlpha = 1;

    // powerups
    powerups.forEach(p => {
      ctx.fillStyle = '#fbbf24';
      ctx.save();
      ctx.translate(p.x+p.w/2, p.y+p.h/2);
      ctx.rotate(frame*0.05);
      ctx.fillRect(-8,-8,16,16);
      ctx.restore();
    });

    // enemies
    enemies.forEach(e => {
      const color = e.kind === 'tank' ? '#a78bfa' : e.kind === 'zig' ? '#f472b6' : '#f87171';
      drawPlane({x:e.x,y:e.y,w:e.w,h:e.h}, color);
    });

    // enemy bullets
    ctx.fillStyle = '#fb7185';
    enemyBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x+3,b.y+3,4,0,Math.PI*2); ctx.fill(); });

    // player bullets
    ctx.fillStyle = '#7dd3fc';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // particles
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life/30);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
    });
    ctx.globalAlpha = 1;

    // boss
    if (boss) {
      ctx.save();
      ctx.translate(boss.x + boss.w/2, boss.y + boss.h/2);
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.moveTo(0, -boss.h/2);
      ctx.lineTo(boss.w/2, 0);
      ctx.lineTo(boss.w/3, boss.h/2);
      ctx.lineTo(-boss.w/3, boss.h/2);
      ctx.lineTo(-boss.w/2, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.arc(0, 0, boss.w*0.18, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // player
    if (invincible <= 0 || frame % 8 < 4) {
      drawPlane(player, '#38bdf8');
    }

    // wave banner
    if (bannerTimer > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, bannerTimer/40);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 18px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 6;
      ctx.fillText(bannerText, W/2, H/2 - 40);
      ctx.restore();
    }
  }

  let loopHandle;
  function loop() {
    if (!running) return;
    update();
    if (running) {
      draw();
      loopHandle = requestAnimationFrame(loop);
    }
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      safeSet('striker_best', best);
    }
    overlayTitle.textContent = 'MISSION OVER';
    overlayMsg.textContent = `Final Score: ${score}`;
    startBtn.textContent = 'Fly Again';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    reset();
    overlay.classList.add('hidden');
    cancelAnimationFrame(loopHandle);
    draw();
    loop();
  }

  startBtn.addEventListener('click', startGame);

  window.addEventListener('keydown', e => {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right' };
    if (map[e.key]) { keys[map[e.key]] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right' };
    if (map[e.key]) { keys[map[e.key]] = false; e.preventDefault(); }
  });

  // touch drag control
  let touchActive = false;
  canvas.addEventListener('touchstart', e => {
    touchActive = true;
    handleTouch(e);
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    handleTouch(e);
  }, {passive:false});
  canvas.addEventListener('touchend', () => { touchActive = false; });

  function handleTouch(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const x = (t.clientX - rect.left) * scaleX;
    const y = (t.clientY - rect.top) * scaleY;
    player.x = Math.max(0, Math.min(W-player.w, x - player.w/2));
    player.y = Math.max(0, Math.min(H-player.h, y - player.h/2));
  }

  reset();
  draw();
})();
</script>
</body>
</html>
